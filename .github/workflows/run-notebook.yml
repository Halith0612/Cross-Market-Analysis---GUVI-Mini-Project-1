name: Run Jupyter Notebook

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install notebook nbconvert nbformat ipykernel

      - name: Run notebook
        run: |
          jupyter nbconvert --execute --to notebook Cross_Market_Analysis.ipynb
